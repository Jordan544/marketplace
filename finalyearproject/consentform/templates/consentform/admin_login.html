{% extends 'consentform/base.html' %}
{% load static %}

{% block title %}Admin Portal Login - Campus Marketplace{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg p-4 rounded-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-shield-halved fs-4"></i>
                </div>
                <h3 class="fw-bold text-dark">Staff Portal</h3>
                <p class="text-muted small">Restricted access for platform administrators only.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Enter admin username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Admin Login
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'listing_list' %}" class="text-decoration-none small text-muted">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Marketplace
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
