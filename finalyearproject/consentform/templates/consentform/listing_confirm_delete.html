{% extends 'consentform/base.html' %}

{% load static %}

{% block title %}Confirm Delete - Campus Marketplace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm p-4 text-center">
            <h3 class="h5 mb-3 text-danger">Delete Listing?</h3>
            <p>Are you sure you want to delete <strong>"{{ listing.title }}"</strong>? This action cannot be undone.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'listing_detail' listing.pk %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
